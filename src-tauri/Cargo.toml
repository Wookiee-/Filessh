[package]
name = "filessh"
version = "0.1.0"
description = "Solar-PuTTY style GUI SSH client for Linux with FileZilla SFTP import (Tauri port)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
ssh2 = "0.9"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
dirs = "5"
rfd = "0.15"
quick-xml = { version = "0.36", features = ["serialize"] }
csv = "1"
chrono = "0.4"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
tauri-plugin-clipboard-manager = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
