<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Filessh</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
</head>
<body>
<div id="tabbar">
  <div id="tabs">
    <button class="tab active" data-view="overview">Overview</button>
  </div>
  <button id="newtab" title="New quick-connect tab">+</button>
</div>

<div id="overview" class="view">
  <div id="searchrow">
    <input id="search" type="text" placeholder="Search sessions…">
    <button id="manage">Site Manager</button>
    <button id="import">Import FileZilla</button>
  </div>
  <details id="quickwrap">
    <summary>Ad-hoc quick connect (unsaved)</summary>
    <div id="quickrow">
      <input id="q-host" placeholder="host">
      <input id="q-user" placeholder="user">
      <input id="q-pass" type="password" placeholder="password (optional)">
      <input id="q-port" placeholder="22" size="4">
      <button id="q-connect">Connect</button>
    </div>
  </details>
  <div id="cards"></div>
</div>

<div id="termview" class="view hidden">
  <div id="termheader">
    <span id="termstatus">disconnected</span>
    <select id="t-theme" title="Terminal theme"></select>
    <select id="t-term" title="Emulation (TERM) — takes effect on next connect"></select>
    <select id="t-cursor" title="Cursor style">
      <option value="block">Block</option>
      <option value="bar">Bar</option>
      <option value="underline">Underline</option>
    </select>
    <button id="t-blink" title="Toggle cursor blink">Blink</button>
    <button id="t-smaller" title="Smaller font">A−</button>
    <button id="t-bigger" title="Larger font">A+</button>
    <button id="sftp-toggle">SFTP</button>
    <button id="term-close">Close</button>
  </div>
  <div id="termwrap">
    <div id="terminal"></div>
    <div id="sftp" class="hidden">
      <div id="sftp-bar">
        <input id="sftp-path" value=".">
        <button id="sftp-go">List</button>
      </div>
      <div id="sftp-list"></div>
    </div>
  </div>
</div>

<dialog id="manager">
  <div id="mgr-layout">
    <div id="mgr-left">
      <div id="mgr-toolbar">
        <button id="m-new" title="New site">+ Site</button>
        <button id="m-folder" title="New folder">+ Folder</button>
        <button id="m-dup" title="Duplicate selected">Duplicate</button>
        <button id="m-del" title="Delete selected">Delete</button>
      </div>
      <input id="m-search" placeholder="Filter sites…">
      <div id="mgr-tree"></div>
    </div>
    <div id="mgr-right">
      <h3>Site Manager</h3>
      <label>Name <input id="m-name"></label>
      <label>Folder <input id="m-group" placeholder="(top level)"></label>
      <label>Host <input id="m-host"></label>
      <label>Port <input id="m-port" value="22"></label>
      <label>Protocol
        <select id="m-proto">
          <option value="sftp">SFTP / SSH</option>
          <option value="ftp" disabled>FTP (imported, not connectable)</option>
        </select>
      </label>
      <label>Logon type
        <select id="m-logon">
          <option value="1">Normal (saved password)</option>
          <option value="2">Ask for password</option>
          <option value="4">Key file</option>
          <option value="0">Anonymous</option>
        </select>
      </label>
      <label>User <input id="m-user"></label>
      <label>Password <input id="m-password" type="password" placeholder="(unchanged)"></label>
      <label>Key file
        <span class="pickrow"><input id="m-keyfile" placeholder="/path/to/key"><button id="m-keybrowse" type="button">Browse…</button></span>
      </label>
      <label>Key passphrase <input id="m-keypass" type="password" placeholder="(unchanged)"></label>
      <label class="check"><input type="checkbox" id="m-agent"> SSH agent forwarding (-A)</label>
      <label>Post-connect script <textarea id="m-script" placeholder="one command per line"></textarea></label>
      <label class="check"><input type="checkbox" id="m-reconnect" checked> Auto-reconnect</label>

      <details class="adv">
        <summary>Connection: keep-alive &amp; jump host</summary>
        <label>Keep-alive interval (s, 0 = off) <input id="m-ka-interval" type="number" min="0" max="3600" placeholder="0"></label>
        <label>Keep-alive max misses <input id="m-ka-count" type="number" min="1" max="100" placeholder="3"></label>
        <label>Jump host (bastion) <select id="m-jump"><option value="">Direct connection</option></select></label>
      </details>

      <details class="adv">
        <summary>Tunnels: port forwarding</summary>
        <div id="m-forwards"></div>
        <button id="m-fwadd" type="button">+ Add tunnel</button>
      </details>

      <details class="adv">
        <summary>X11 forwarding</summary>
        <label class="check"><input type="checkbox" id="m-x11"> Enable X11 forwarding</label>
        <label>Display screen <input id="m-x11screen" type="number" min="0" max="99" value="0"></label>
      </details>

      <details class="adv">
        <summary>Crypto: ciphers &amp; key exchange</summary>
        <label>Ciphers (blank = defaults) <input id="m-ciphers" placeholder="aes128-ctr,aes256-ctr,aes128-gcm@openssh.com"></label>
        <label>Key exchange <input id="m-kex" placeholder="curve25519-sha256,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256"></label>
        <label>Host key types <input id="m-hostkeys" placeholder="ssh-ed25519,ecdsa-sha2-nistp256,rsa-sha2-512"></label>
      </details>

      <details class="adv">
        <summary>Session logging</summary>
        <label class="check"><input type="checkbox" id="m-log"> Save terminal output to file</label>
        <label>Log file (blank = auto)
          <span class="pickrow"><input id="m-logpath" placeholder="auto"><button id="m-logbrowse" type="button">Browse…</button></span>
        </label>
      </details>
      <menu>
        <button id="m-connect">Connect</button>
        <button id="m-save">Save</button>
        <button id="m-close">Close</button>
      </menu>
      <div id="m-status"></div>
    </div>
  </div>
</dialog>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <h3>Session</h3>
    <input id="e-name" placeholder="Name" required>
    <input id="e-host" placeholder="Host" required>
    <input id="e-port" placeholder="Port" value="22">
    <input id="e-user" placeholder="Username" required>
    <select id="e-auth"><option value="password">Password</option><option value="key">Private key</option></select>
    <input id="e-password" type="password" placeholder="Password (saved encrypted)">
    <span class="pickrow"><input id="e-keyfile" placeholder="Key file path (optional)"><button id="e-keybrowse" type="button">…</button></span>
    <textarea id="e-script" placeholder="Post-connection script (one command per line)"></textarea>
    <label><input type="checkbox" id="e-reconnect" checked> Auto-reconnect</label>
    <menu>
      <button value="cancel">Cancel</button>
      <button id="e-save" value="default">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h3>Settings</h3>
    <label>Default terminal theme <select id="s-theme"></select></label>
    <label>Default emulation (TERM) <select id="s-term"></select></label>
    <label>Default font size <input id="s-fontsize" type="number" min="9" max="24"></label>
    <label><input type="checkbox" id="s-confirm"> Confirm before closing a connected tab</label>
    <label><input type="checkbox" id="s-reconnect"> New sites default to auto-reconnect</label>
    <label>SFTP initial path <input id="s-sftppath" placeholder="."></label>
    <label>Scrollback rows <input id="s-scrollback" type="number" min="100" max="50000" step="100"></label>
    <label><input type="checkbox" id="s-copyselect"> Copy on select</label>
    <label><input type="checkbox" id="s-pasteclick"> Right-click pastes</label>
    <label>Default keep-alive (s, 0 = off) <input id="s-ka" type="number" min="0" max="3600"></label>
    <label>Session log directory <input id="s-logdir" placeholder="~/.config/filessh/logs"></label>
    <label><input type="checkbox" id="s-autolog"> Log all sessions by default</label>
    <menu>
      <button value="cancel">Cancel</button>
      <button id="s-save" value="default">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="verify">
  <h3 id="v-title">Unknown host key</h3>
  <p id="v-text"></p>
  <div id="v-keys"></div>
  <menu>
    <button id="v-save">Accept &amp; Save</button>
    <button id="v-once">Accept once</button>
    <button id="v-reject">Reject</button>
  </menu>
</dialog>

<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="renderer.js"></script>
</body>
</html>
