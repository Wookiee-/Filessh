name: rolling

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling
  cancel-in-progress: true

jobs:
  tauri:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run tauri:build

      - name: Check the binary starts its libraries
        run: |
          ! ldd src-tauri/target/release/filessh | grep "not found"

      - uses: actions/upload-artifact@v7
        with:
          name: tauri-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/tech.wookiee.filessh.yml
          cache-key: flatpak-${{ github.sha }}
          bundle: Filessh.flatpak

  arch:
    needs: tauri
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tauri-bundles
          path: /tmp/bundles

      - name: Build package
        run: |
          pacman -Syu --noconfirm base-devel git gtk3 hicolor-icon-theme libsoup3 webkit2gtk-4.1 openssl
          useradd -m builder
          cp /tmp/bundles/deb/*.deb packaging/arch/
          chown -R builder packaging/arch
          cd packaging/arch
          su builder -c "makepkg -f --noconfirm"
          find . -name '*.pkg.tar.zst' ! -name '*-debug-*' -exec cp {} /tmp/bundles/ \;

      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: /tmp/bundles/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [tauri, flatpak, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Replace rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rolling --cleanup-tag --yes || true
          gh release create rolling $(find dist -type f) \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Filessh rolling ($(git rev-parse --short HEAD))" \
            --notes "Automatically built from main at $GITHUB_SHA."
